<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginekologia i Położnictwo - MT Medic Centrum Medyczne Krosno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        premium: {
                            dark: 'rgb(29, 45, 77)',
                            accent: 'rgb(204, 171, 118)',
                            accentLight: 'rgba(204, 171, 118, 0.1)',
                        },
                        blue: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#bae0fd',
                            300: '#8bc4f9',
                            400: '#60a5f2',
                            500: '#3b8edb',
                            600: '#2c74b8',
                            700: '#225d94',
                            800: '#1c4d7a',
                            900: '#174164',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <top-bar></top-bar>
    <main-nav></main-nav>
    
    <!-- Header Section -->
    <specialist-header 
        title="Ginekologia i Położnictwo" 
        description="Kompleksowa opieka ginekologiczna i położnicza, wspierająca kobiety na każdym etapie życia, od profilaktyki po opiekę nad ciążą.">
    </specialist-header>
    
    <!-- Specialist Section -->
    <section class="py-12 px-4">
        <specialist-profile 
            name="lek. med. Mariola Stapińska" 
            specialty="specjalista położnictwa i ginekologii" 
            image="assets/images/55b191720853af6cf19c3c33620a81d7_773ab17c2fe64718b8df0cc6c8435f4e.jpg" 
            description="Specjalista położnictwa i ginekologii, ekspert w zakresie USG 3/4D płodu i narządu rodnego transvaginal oraz USG Doppler.">
        </specialist-profile>
    </section>
    
    <!-- Services Grid -->
    <section class="py-20 px-4">
        <div class="max-w-7xl mx-auto">
            <h3 class="text-2xl font-medium text-center text-slate-900 mb-12">Zakres Usług i Badań</h3>
            
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <service-card title="Konsultacje Ginekologiczne" description="Systematyczna opieka i profilaktyka zdrowia układu rozrodczego kobiet w każdym wieku."></service-card>
                <service-card title="USG Ginekologiczne i Położnicze" description="Wysokiej jakości obrazowanie 3D/4D płodu i narządów rodnych, w tym badanie Doppler."></service-card>
                <service-card title="Cytologia i Profilaktyka" description="Badanie cytologiczne szyjki macicy pozwalające na wczesne wykrycie zmian nowotworowych."></service-card>
                <service-card title="Opieka nad Ciążą" description="Profesjonalne prowadzenie ciąży, monitoring tętna płodu (KTG) i wsparcie położnicze."></service-card>
                <service-card title="Diagnostyka Piersi" description="Profilaktyczne badania piersi oraz specjalistyczne USG sutków."></service-card>
                <service-card title="Planowanie Ciąży i Leczenie" description="Porady w zakresie planowania rodziny oraz nowoczesne metody leczenia niepłodności."></service-card>
                <service-card title="Leczenie Endometriozy" description="Diagnostyka i terapia endometriozy oraz innych zaburzeń miesiączkowania."></service-card>
                <service-card title="Hormonalna Antykoncepcja" description="Dobór antykoncepcji hormonalnej oraz zakładanie wkładek wewnątrzmacicznych."></service-card>
                <service-card title="Leczenie Infekcji i Nadżerek" description="Kompleksowe leczenie infekcji dróg rodnych i zabiegów usuwania nadżerek szyjki macicy."></service-card>
            </div>
        </div>
    </section>
    
    <!-- Footer -->
    <main-footer></main-footer>
    
</body>
</html>
