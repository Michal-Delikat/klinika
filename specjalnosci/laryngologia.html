<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laryngologia - MT Medic Centrum Medyczne Krosno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        premium: {
                            dark: 'rgb(29, 45, 77)',
                            accent: 'rgb(204, 171, 118)',
                            accentLight: 'rgba(204, 171, 118, 0.1)',
                        },
                        blue: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#bae0fd',
                            300: '#8bc4f9',
                            400: '#60a5f2',
                            500: '#3b8edb',
                            600: '#2c74b8',
                            700: '#225d94',
                            800: '#1c4d7a',
                            900: '#174164',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <top-bar></top-bar>
    <main-nav></main-nav>
    
    <!-- Header Section -->

    <!-- Header Section -->
    <specialist-header 
        title="Laryngologia" 
        description="Profesjonalna opieka otorynolaryngologiczna, nowoczesne zabiegi operacyjne i diagnostyka w najwyższym standardzie.">
    </specialist-header>

    <!-- Specialist Section -->
    <section class="py-12 px-4">
        <specialist-profile 
            name="dr n. med. Tomasz Stapiński" 
            specialty="specjalista otorynolaryngolog" 
            image="assets/images/laryngologia.jpg" 
            description="Doświadczony specjalista w dziedzinie laryngologii, koncentrujący się na nowoczesnych metodach leczenia zachowawczego i operacyjnego.">
        </specialist-profile>
    </section>

    <!-- Services Grid -->
    <services-grid>
        <service-card title="Korekcja nosa i przegrody" description="Rynoseptoplastyka funkcjonalna – operacja przegrody nosa i nosa zewnętrznego w celu poprawy estetyki i funkcji oddychania."></service-card>
        <service-card title="Septoplastyka" description="Korekcja zniekształconej przegrody nosa dla zapewnienia prawidłowego przepływu powietrza. Element leczenia bezdechu sennego."></service-card>
        <service-card title="Konchoplastyka" description="Plastyka małżowin nosowych metodą tradycyjną lub radiochirurgią „Ellman” w celu poprawy drożności nosa."></service-card>
        <service-card title="Operacje FESS" description="Mało-inwazyjne zabiegi endoskopowe w obrębie zatok przynosowych."></service-card>
        <service-card title="Usuwanie torbieli zatok" description="Nowoczesna metoda endoskopowa usuwania torbieli zębopochodnych z zatok szczękowych."></service-card>
        <service-card title="Blefaroplastyka" description="Specjalistyczna plastyka powiek łącząca funkcjonalność z estetyką."></service-card>
        <service-card title="Adenotomia" description="Endoskopowe usunięcie tzw. &quot;trzeciego migdałka&quot; w znieczuleniu ogólnym."></service-card>
        <service-card title="Drenaż ucha środkowego" description="Leczenie wysiękowego zapalenia ucha środkowego poprzez założenie drenika wentylacyjnego."></service-card>
        <service-card title="Leczenie chrapania i bezdechu" description="Zabiegi chirurgiczne oraz radiochirurgia „Ellman” w celu eliminacji problemów z oddychaniem podczas snu."></service-card>
        <service-card title="Usuwanie znamion i nowotworów" description="Chirurgiczne usuwanie zmian skórnych twarzy z plastyką ubytku i badaniem histopatologicznym."></service-card>
        <service-card title="Nasofiberoskopia" description="Precyzyjne badanie endoskopowe trzeciego migdałka."></service-card>
        <service-card title="Otoplastyka" description="Chirurgiczna korekcja odstających lub zniekształconych małżowin usznych."></service-card>
    </services-grid>

    <!-- Footer -->
    <main-footer></main-footer>

</body>
</html>
